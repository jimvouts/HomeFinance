let mrExtras=[];

function mMrEntry(existing){
  const N=new Date(), e=existing||{}, id=e.id||'', rate=state.mrRate||5;
  mrExtras=(e.extras||[]).map(x=>({...x}));
  const extrasHtml=mrExtras.map((x,i)=>`
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input class="inp" style="flex:1" placeholder="Αντικείμενο" value="${(x.item||'').replace(/"/g,'&quot;')}" oninput="mrExtras[${i}].item=this.value"/>
      <input class="inp" style="width:90px" type="number" placeholder="€ τιμή" value="${x.price||''}" oninput="mrExtras[${i}].price=parseFloat(this.value)||0"/>
      <button onclick="removeMrExtra(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px">×</button>
    </div>`).join('');

function addMrExtra(){ mrExtras.push({item:'',price:0}); refreshMrExtrasList(); }
function removeMrExtra(i){ mrExtras.splice(i,1); refreshMrExtrasList(); }
function updateMrProfit(idx){
  // Update only the profit display for one extra without re-rendering the whole list
  const x = mrExtras[idx];
  if(!x) return;
  const profit = (x.price && x.cost) ? +(x.price - x.cost).toFixed(2) : null;
  const profitEl = document.getElementById('mr-profit-'+idx);
  if(profitEl){
    profitEl.textContent = profit!==null && profit>0 ? 'Κέρδος: €'+profit : '';
    profitEl.style.color = '#34d399';
  }
}

function refreshMrExtrasList(){
  const el=document.getElementById('mr-extras-list'); if(!el) return;
  const prods = state.mrProducts||[];
  el.innerHTML = mrExtras.map((x,i)=>{
    const profit = (x.price&&x.cost) ? +(x.price - x.cost).toFixed(2) : null;
    const prodOpts = prods.map(p=>
      `<option value="${p.id}" ${x._prodId===p.id?'selected':''}>${p.name} (€${p.price})</option>`
    ).join('');
    return `<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
        ${prods.length>0?`
        <select class="inp" style="flex:1;font-size:13px" onchange="selectMrProduct(this.value,${i})">
          <option value="">-- Επίλεξε από τιμοκατάλογο --</option>
          ${prodOpts}
        </select>`:''}
        <button onclick="removeMrExtra(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:20px;padding:0 4px;flex-shrink:0">×</button>
      </div>
      <input class="inp" style="margin-bottom:6px;font-size:13px" placeholder="Όνομα αντικειμένου"
        value="${(x.item||'').replace(/"/g,'&quot;')}"
        oninput="mrExtras[${i}].item=this.value"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div>
          <div style="font-size:10px;color:var(--text2);margin-bottom:3px">Κόστος αγοράς</div>
          <input class="inp" type="number" inputmode="decimal" placeholder="€" step="0.5"
            value="${x.cost||''}"
            oninput="mrExtras[${i}].cost=parseFloat(this.value)||0;updateMrProfit(${i})"/>
        </div>
        <div>
          <div style="font-size:10px;color:var(--text2);margin-bottom:3px">Τιμή πώλησης</div>
          <input class="inp" type="number" inputmode="decimal" placeholder="€" step="0.5"
            value="${x.price||''}"
            oninput="mrExtras[${i}].price=parseFloat(this.value)||0;updateMrProfit(${i})"/>
        </div>
      </div>
      <div id="mr-profit-${i}" style="font-size:11px;color:#34d399;margin-top:6px;font-weight:700">${profit!==null&&profit>0?'Κέρδος: €'+profit:''}</div>
    </div>`;
  }).join('');
}

async function saveMrEntry(existingId){
  const dateVal=g('mr-date').value, hours=parseFloat(g('mr-hours').value);
  const notes=g('mr-notes').value.trim();
  if(!dateVal||!hours) return;
  const d=new Date(dateVal);
  const earnings=+(hours*(state.mrRate||5)).toFixed(2);
  const row={id:existingId||`mr${Date.now()}`,date:dateVal,year:d.getFullYear(),month:d.getMonth()+1,hours,earnings,notes,extras:mrExtras.filter(x=>x.item||x.price>0)};
  if(existingId) state.mrEntries=state.mrEntries.map(e=>e.id===existingId?row:e);
  else state.mrEntries.push(row);
  closeModal(); render();
  try{ await db.collection('mister_robot').doc(row.id).set({date:row.date,year:row.year,month:row.month,hours:row.hours,earnings:row.earnings,notes:row.notes,extras:row.extras,created_at:firebase.firestore.FieldValue.serverTimestamp()}); }catch(e){console.error(e);}
}

function editMrEntry(id){
  const e=state.mrEntries.find(x=>x.id===id); if(!e) return;
  const m=document.getElementById('modal'), mi=document.getElementById('modal-inner');
  m.classList.remove('hidden');
  mi.innerHTML='<span class="modal-handle"></span>'+mMrEntry(e);
}

async function deleteMrEntry(id){
  if(!confirm('Διαγραφή εγγραφής;')) return;
  state.mrEntries=state.mrEntries.filter(e=>e.id!==id); render();
  try{ await db.collection('mister_robot').doc(id).delete(); }catch(e){console.error(e);}
}

function editMrProduct(id){
  const p=state.mrProducts.find(x=>x.id===id); if(!p) return;
  const ni=document.getElementById('mrp-name'), ci=document.getElementById('mrp-cost'), pi=document.getElementById('mrp-price');
  if(ni) ni.value=p.name;
  if(ci) ci.value=p.cost;
  if(pi) pi.value=p.price;
  // Change button to save edit
  const btn=document.querySelector('[onclick="saveMrProduct(null)"]');
  if(btn){ btn.textContent='✔ Αποθήκευση'; btn.setAttribute('onclick',`saveMrProduct('${id}')`); }
}

async function saveMrRate(){
  const r=parseFloat(document.getElementById('mr-rate').value)||5;
  state.mrRate=r; closeModal(); render();
  try{ await db.collection('settings').doc('mister_robot').set({hourlyRate:r},{merge:true}); }catch(e){console.error(e);}
}

// PAGE: ΑΝΑΦΟΡΕΣ
// ═══════════════════════════════════════════════════════════════════
function pgReports(){
  const yr = state.filterYear;
  // Monthly data for the year
  const moData = MONTHS.map((mn,i)=>{
    const mo=i+1;
    const persExp = state.expenses.filter(e=>e.year===yr&&e.month===mo).reduce((s,e)=>s+e.amount,0);
    const shExp   = state.sharedExp.filter(e=>e.year===yr&&e.month===mo).reduce((s,e)=>s+e.amount,0);
    const fuelExp = state.fuel.filter(f=>f.year===yr&&f.month===mo).reduce((s,f)=>s+f.amount,0);
    const mykExp  = state.mykonos.filter(e=>e.year===yr&&e.month===mo).reduce((s,e)=>s+e.amount,0);
    const inc     = state.incomes.filter(i=>i.year===yr&&i.month===mo).reduce((s,i)=>s+i.base+i.extra,0);
    const total   = persExp+shExp+fuelExp+mykExp;
    const savings = inc-total;
    return{mo,mn:MONTHS_S[i],persExp,shExp,fuelExp,mykExp,inc,total,savings};
  });

  const activeMonths = moData.filter(m=>m.total>0||m.inc>0);
  const totInc  = activeMonths.reduce((s,m)=>s+m.inc,0);
  const totExp  = activeMonths.reduce((s,m)=>s+m.total,0);
  const totSav  = totInc-totExp;
  const avgMoExp= activeMonths.length>0?totExp/activeMonths.length:0;
  const avgMoInc= activeMonths.length>0?totInc/activeMonths.length:0;

  // Best/worst months
  const withData = moData.filter(m=>m.total>0);
  const bestMo  = withData.length?[...withData].sort((a,b)=>a.total-b.total)[0]:null;
  const worstMo = withData.length?[...withData].sort((a,b)=>b.total-a.total)[0]:null;

  // Category totals for the year
  const catTotals={};
  state.expenses.filter(e=>e.year===yr).forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount;});
  state.sharedExp.filter(e=>e.year===yr).forEach(e=>{catTotals[e.category]=(catTotals[e.category]||0)+e.amount;});
  const catSorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const topCat=catSorted[0];

  // User breakdown
  const dimExp = state.expenses.filter(e=>e.year===yr&&e.user==="Δημήτρης").reduce((s,e)=>s+e.amount,0);
  const annExp = state.expenses.filter(e=>e.year===yr&&e.user==="Άννα").reduce((s,e)=>s+e.amount,0);

  // Month-over-month comparison (last 3 months)
  const now=new Date(), lastMos=[];
  for(let i=2;i>=0;i--){
    let mo=now.getMonth()+1-i, y=yr;
    if(mo<=0){mo+=12;y--;}
    const m=moData.find(x=>x.mo===mo);
    if(m) lastMos.push({...m,y});
  }

  return `<div class="col">
    <div class="page-title">📈 Αναφορές ${yr}</div>

    <!-- KPIs ετήσια -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
      ${[
        {l:"Συνολικά Έσοδα",v:totInc,c:"var(--green)",i:"📈"},
        {l:"Συνολικά Έξοδα",v:totExp,c:"var(--red)",i:"📉"},
        {l:"Αποταμίευση",v:totSav,c:totSav>=0?"var(--green)":"var(--red)",i:"💰"},
        {l:"Μέσος Μήνας Έξοδα",v:avgMoExp,c:"var(--orange)",i:"📊"},
      ].map(k=>`
        <div class="kpi-card">
          <div style="font-size:18px;margin-bottom:4px">${k.i}</div>
          <div style="color:var(--text2);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:2px">${k.l}</div>
          <div style="font-size:20px;font-weight:800;color:${k.c}">€${fmt(Math.abs(k.v))}</div>
        </div>`).join('')}
    </div>

    <!-- Highlights -->
    <div class="card">
      <div class="section-label">Highlights ${yr}</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${bestMo?`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text2)">✅ Καλύτερος μήνας (λιγότερα έξοδα)</span><span style="color:var(--green);font-weight:700">${bestMo.mn} — €${fmt(bestMo.total)}</span></div>`:''}
        ${worstMo?`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text2)">⚠️ Ακριβότερος μήνας</span><span style="color:var(--red);font-weight:700">${worstMo.mn} — €${fmt(worstMo.total)}</span></div>`:''}
        ${topCat?`<div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text2)">🏆 Top κατηγορία εξόδων</span><span style="color:var(--orange);font-weight:700">${topCat[0]} — €${fmt(topCat[1])}</span></div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text2)">👨 Προσωπικά Δημήτρης</span><span style="font-weight:700;color:#6c8fff">€${fmt(dimExp)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text2)">👩 Προσωπικά Άννα</span><span style="font-weight:700;color:#f778ba">€${fmt(annExp)}</span></div>
      </div>
    </div>

    <!-- Μηνιαία σύγκριση πίνακας -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div class="section-label" style="margin:0">Μηνιαία Ανάλυση ${yr}</div>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr style="background:rgba(255,255,255,0.04)">
              <th style="text-align:left;padding:10px 14px;color:var(--text2);font-weight:600">Μήνας</th>
              <th style="text-align:right;padding:10px 10px;color:var(--text2);font-weight:600">Έσοδα</th>
              <th style="text-align:right;padding:10px 10px;color:var(--text2);font-weight:600">Έξοδα</th>
              <th style="text-align:right;padding:10px 10px;color:var(--text2);font-weight:600">Καύσιμα</th>
              <th style="text-align:right;padding:10px 10px;color:var(--text2);font-weight:600">Μύκονος</th>
              <th style="text-align:right;padding:10px 14px;color:var(--text2);font-weight:600">Υπόλοιπο</th>
            </tr>
          </thead>
          <tbody>
            ${moData.filter(m=>m.total>0||m.inc>0).map(m=>`
              <tr style="border-bottom:1px solid rgba(255,255,255,0.04)">
                <td style="padding:10px 14px;font-weight:600">${m.mn}</td>
                <td style="padding:10px 10px;text-align:right;color:var(--green)">€${fmt(m.inc)}</td>
                <td style="padding:10px 10px;text-align:right;color:var(--red)">€${fmt(m.persExp+m.shExp)}</td>
                <td style="padding:10px 10px;text-align:right;color:var(--yellow)">€${fmt(m.fuelExp)}</td>
                <td style="padding:10px 10px;text-align:right;color:#2dd4bf">€${fmt(m.mykExp)}</td>
                <td style="padding:10px 14px;text-align:right;font-weight:700;color:${m.savings>=0?'var(--green)':'var(--red)'}">
                  ${m.savings>=0?'+':''}€${fmt(m.savings)}
                </td>
              </tr>`).join('')}
            <tr style="background:rgba(255,255,255,0.04);font-weight:800">
              <td style="padding:10px 14px">ΣΥΝΟΛΟ</td>
              <td style="padding:10px 10px;text-align:right;color:var(--green)">€${fmt(totInc)}</td>
              <td style="padding:10px 10px;text-align:right;color:var(--red)">€${fmt(totExp-activeMonths.reduce((s,m)=>s+m.fuelExp+m.mykExp,0))}</td>
              <td style="padding:10px 10px;text-align:right;color:var(--yellow)">€${fmt(activeMonths.reduce((s,m)=>s+m.fuelExp,0))}</td>
              <td style="padding:10px 10px;text-align:right;color:#2dd4bf">€${fmt(activeMonths.reduce((s,m)=>s+m.mykExp,0))}</td>
              <td style="padding:10px 14px;text-align:right;color:${totSav>=0?'var(--green)':'var(--red)'}">
                ${totSav>=0?'+':''}€${fmt(totSav)}
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Top Categories -->
    <div class="card">
      <div class="section-label">Top Κατηγορίες ${yr}</div>
      ${catSorted.slice(0,8).map(([c,v])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:16px;width:24px;text-align:center">${CAT_ICON(c)}</span>
          <div style="flex:1">
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <span style="font-size:13px">${c}</span>
              <span style="font-weight:700;color:var(--red);font-size:13px">€${fmt(v)}</span>
            </div>
            <div style="height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${Math.round(v/catSorted[0][1]*100)}%;background:${CAT_COLORS[c]||'#94a3b8'};border-radius:3px"></div>
            </div>
          </div>
          <span style="font-size:11px;color:var(--text2);min-width:30px;text-align:right">${Math.round(v/totExp*100)}%</span>
        </div>`).join('')}

    <!-- Cash Flow Chart -->
    <div class="card">
      <div class="section-label" style="margin-bottom:10px">💹 Cash Flow — Έσοδα vs Έξοδα ${yr}</div>

      <div style="display:flex;gap:16px;margin-top:10px;justify-content:center">

        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#5a7fd4"></div><span style="font-size:11px;color:var(--text2)">Καθαρό</span></div>

        const prev = arr[i+1];
        function arrow(cur, p){ if(!p||!p.tot) return ''; const d=cur.tot-p.tot; return d>0?`<span style="color:var(--red);font-size:10px">↑ +€${fmt(d)}</span>`:`<span style="color:var(--green);font-size:10px">↓ -€${fmt(Math.abs(d))}</span>`; }
        const net = m.inc - m.tot;
        const prevNet = prev ? prev.inc - prev.tot : null;
        const netDiff = prevNet !== null ? net - prevNet : null;
        return `<div class="trow">
          <div style="min-width:70px;font-size:13px;font-weight:700">${MONTHS_S[m.mo-1]}</div>
          <div style="flex:1;min-width:0">

            </div>
            <div style="height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${m.inc>0?Math.min(100,Math.round(m.tot/m.inc*100)):0}%;background:${m.tot>m.inc?'#e05555':'#5a7fd4'};border-radius:2px"></div>
            </div>
          </div>
          <div style="text-align:right;min-width:70px;font-size:10px">
            ${prev?`<div style="color:${netDiff>=0?'var(--green)':'var(--red)'}">${netDiff>=0?'▲':'▼'} vs ${MONTHS_S[prev.mo-1]}</div>`:''}
          </div>
        </div>`;
      }).join('')}
    </div>

    <!-- Cash Flow Chart -->
    <div class="card">
      <div class="section-label" style="margin-bottom:10px">💹 Cash Flow — Έσοδα vs Έξοδα ${yr}</div>
      <div style="position:relative;height:170px"><canvas id="ch-cashflow"></canvas></div>
      <div style="display:flex;gap:16px;margin-top:8px;justify-content:center;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#3dba6f"></div><span style="font-size:11px;color:var(--text2)">Έσοδα</span></div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:2px;background:#e05555"></div><span style="font-size:11px;color:var(--text2)">Έξοδα</span></div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:2px;height:10px;background:#5a7fd4;border-radius:1px"></div><span style="font-size:11px;color:var(--text2)">Καθαρό</span></div>
      </div>
    </div>

        <!-- Month comparison -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.06)">
        <div class="section-label" style="margin:0">📊 Σύγκριση Μηνών</div>
      </div>
      <div id="mo-compare-rows"></div>
    </div>

        <!-- Export PDF -->
    <button class="btn" onclick="exportPDF()" style="justify-content:center;gap:8px">
      📄 Εξαγωγή σε PDF
    </button>
  </div>`;
}

// ── setBudgetFor: open modal to set budget for a category ──
function setBudgetFor(cat){
  const cur = state.budgets[cat]||'';
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal-inner').innerHTML = `
    <span class="modal-handle"></span>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:16px;font-weight:700">${CAT_ICON(cat)} ${cat}</h2>
      <button onclick="closeModal()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:22px">×</button>
    </div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">Ορισμός μηνιαίου ορίου δαπάνης για την κατηγορία <strong style="color:var(--text)">${cat}</strong>.</div>
    <input id="budget-val" class="inp" type="number" inputmode="decimal" placeholder="Μηνιαίο όριο (€)" value="${cur}" style="margin-bottom:14px"/>
    <div style="display:flex;gap:10px">
      ${cur?`<button class="btng" style="flex:1" onclick="saveBudget('${cat}',0)">🗑 Αφαίρεση</button>`:''}
      <button class="btng" style="flex:1" onclick="closeModal()">Άκυρο</button>
      <button class="btn" style="flex:1;justify-content:center" onclick="saveBudget('${cat}')">✔ Αποθήκευση</button>
    </div>`;
}
async function saveBudget(cat, forceVal){
  const val = forceVal !== undefined ? forceVal : parseFloat(document.getElementById('budget-val').value)||0;
  if(val===0) delete state.budgets[cat];
  else state.budgets[cat]=val;
  closeModal(); render();
  await dbSaveBudgets(state.budgets);
}

// ── deleteMykonos ──
async function deleteMykonos(id){
  state.mykonos=state.mykonos.filter(x=>x.id!==id);
  render();
  await dbDelete('mykonos',id);
}

async function saveMykonos(){
  const name=g('mk-name').value.trim(), amount=parseFloat(g('mk-amount').value);
  if(!name||!amount)return;
  const dateVal = g('mk-date').value || new Date().toISOString().slice(0,10);
  const d = new Date(dateVal);
  const row={id:`mk${Date.now()}`,name,amount,
    date:dateVal, year:d.getFullYear(), month:d.getMonth()+1,
    category:g('mk-cat').value,paidBy:getBtn('mku',['Κοινό','Δημήτρης','Άννα']),notes:g('mk-notes').value.trim()};
  state.mykonos.push(row);
  closeModal(); render();
  await dbInsertMykonos(row);
}

function editIncome(id){
  const inc = state.incomes.find(x=>x.id===id);
  if(!inc) return;
  const m=document.getElementById('modal'),mi=document.getElementById('modal-inner');
  m.classList.remove('hidden');
  mi.innerHTML = `

      <button onclick="closeModal()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:24px">×</button>
    </div>

      <span class="chip" style="margin-left:4px;background:${inc.isBaseSalary?'rgba(108,143,255,0.15)':'rgba(67,233,123,0.15)'};color:${inc.isBaseSalary?'#6c8fff':'var(--green)'}">
        ${inc.isBaseSalary?'Μισθός':'Extra'}
      </span>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label style="font-size:12px;color:var(--text2);display:block;margin-bottom:6px">Περιγραφή / Πηγή</label>

// ── Resizable expense charts divider ─────────────────────────────────────────
let _resizing = false, _resizeX = 0, _resizeStartW = 0;

function startResize(e){
  e.preventDefault();
  _resizing = true;
  _resizeX = e.clientX;
  const pie = document.getElementById('exp-pie-panel');
  _resizeStartW = pie ? pie.offsetWidth : 180;
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup', stopResize);
  document.getElementById('exp-divider').style.background='rgba(108,143,255,0.4)';
}
function startResizeTouch(e){
  _resizing = true;
  _resizeX = e.touches[0].clientX;
  const pie = document.getElementById('exp-pie-panel');
  _resizeStartW = pie ? pie.offsetWidth : 180;
  document.addEventListener('touchmove', doResizeTouch, {passive:false});
  document.addEventListener('touchend', stopResize);
}
function doResize(e){
  if(!_resizing) return;
  const dx = e.clientX - _resizeX;
  applyResize(_resizeStartW + dx);
}
function doResizeTouch(e){
  if(!_resizing) return;
  e.preventDefault();
  const dx = e.touches[0].clientX - _resizeX;
  applyResize(_resizeStartW + dx);
}
function applyResize(newW){
  const pie = document.getElementById('exp-pie-panel');
  if(!pie) return;
  const row = document.getElementById('exp-charts-row');
  const maxW = row ? Math.floor(row.offsetWidth * 0.5) : 320;
  const clamped = Math.max(100, Math.min(maxW, newW));
  pie.style.width = clamped + 'px';
  // Redraw charts after resize
  clearTimeout(applyResize._t);
  applyResize._t = setTimeout(()=>{
    if(state.tab==='expenses') renderCharts();
  }, 100);
}
function stopResize(){
  _resizing = false;
  document.removeEventListener('mousemove', doResize);
  document.removeEventListener('mouseup', stopResize);
  document.removeEventListener('touchmove', doResizeTouch);
  document.removeEventListener('touchend', stopResize);
  const div = document.getElementById('exp-divider');
  if(div) div.style.background='rgba(255,255,255,0.04)';
}

// ── Drag & Drop reordering ────────────────────────────────────────────────────
let _dragId = null;

function applyWidgetOrder(){
  const grid = document.getElementById('dash-grid');
  if(!grid) return;
  // Ensure all IDs are in order (add any missing)
  const allIds = [...new Set([..._widgetOrder, ...WIDGET_IDS])];
  allIds.forEach(id=>{
    const el = document.getElementById(id+'-wrap');
    if(el) grid.appendChild(el);  // moves to end in order
  });
}

function initDragDrop(){
  WIDGET_IDS.forEach(id=>{
    const el = document.getElementById(id+'-wrap');
    if(!el) return;
    el.draggable = true;
    el.addEventListener('dragstart', e=>{
      if(!_dashEditing){ e.preventDefault(); return; }
      _dragId = id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      document.querySelectorAll('.widget-wrap').forEach(w=>w.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e=>{
      if(!_dashEditing || !_dragId || _dragId===id) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.widget-wrap').forEach(w=>w.classList.remove('drag-over'));
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', ()=>el.classList.remove('drag-over'));
    el.addEventListener('drop', async e=>{
      if(!_dashEditing || !_dragId || _dragId===id) return;
      e.preventDefault();
      el.classList.remove('drag-over');
      // Reorder
      const fromIdx = _widgetOrder.indexOf(_dragId);
      const toIdx   = _widgetOrder.indexOf(id);
      if(fromIdx>-1 && toIdx>-1){
        _widgetOrder.splice(fromIdx,1);
        _widgetOrder.splice(toIdx,0,_dragId);
        applyWidgetOrder();
        await saveWidgetLayout();
      }
      _dragId = null;
    });

    // Touch drag support
    let _touchStartY=0, _touchEl=null;
    el.addEventListener('touchstart', e=>{
      if(!_dashEditing) return;
      _touchStartY = e.touches[0].clientY;
    },{passive:true});
  });
}

let _dashEditing = false;
function toggleDashEdit(){
  _dashEditing = !_dashEditing;
  document.querySelectorAll('.widget-wrap').forEach(w=>{
    w.classList.toggle('editing', _dashEditing);
    w.draggable = _dashEditing;
  });

}

function renderDashWidgets(){

}

function setTheme(mode){
  if(mode==='light'){
    document.body.classList.add('light-mode');
    localStorage.setItem('hf_theme','light');
  } else {
    document.body.classList.remove('light-mode');
    localStorage.setItem('hf_theme','dark');
  }
  openProfileModal('theme'); // refresh
  showToast(mode==='light'?'☀️ Light mode ενεργό':'🌙 Dark mode ενεργό');
}

async function handleProfilePhoto(input){
  const file=input.files[0]; if(!file) return;
  showToast('⏳ Επεξεργασία...','ok',15000);
  try{
    const b64 = await compressImage(file, 96, 0.55);
    const sizeKB = Math.round(b64.length * 3/4 / 1024);

    // 1. Update UI immediately
    if(currentUser) currentUser.photo = b64;
    updateDrawerUser();

    // 2. Save to localStorage FIRST (always works)
    const uid = auth.currentUser?.uid || 'anon';
    localStorage.setItem('hf_photo_'+uid, b64);

    // 3. Try Firebase async (non-blocking)
    let savedToFirebase = false;
    try{
      await db.collection('users').doc(uid).set({photo:b64},{merge:true});
      savedToFirebase = true;
    }catch(e){ console.warn('[Photo] Firebase skip:', e.code); }

    showToast('✅ Φωτογραφία αποθηκεύτηκε'+(savedToFirebase?'':' (τοπικά)')+' · '+sizeKB+'KB');
    openProfileModal('theme');
  }catch(e){
    console.error('[Photo] Error:', e);
    showToast('❌ '+e.message,'err');
  }
}

function compressImage(file, maxPx, quality){
  return new Promise((resolve, reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const canvas=document.createElement('canvas');
      let w=img.width, h=img.height;
      // Scale down to fit maxPx
      if(w>h){ if(w>maxPx){h=Math.round(h*maxPx/w);w=maxPx;} }
      else    { if(h>maxPx){w=Math.round(w*maxPx/h);h=maxPx;} }
      canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror=reject;
    img.src=url;
  });
}

async function changePassword(){
  const pw1=document.getElementById('prof-pw1').value;
  const pw2=document.getElementById('prof-pw2').value;
  if(!pw1||pw1.length<6){ showToast('❌ Τουλάχιστον 6 χαρακτήρες','err'); return; }
  if(pw1!==pw2){ showToast('❌ Τα passwords δεν ταιριάζουν','err'); return; }
  try{
    await auth.currentUser.updatePassword(pw1);
    showToast('✅ Password άλλαξε επιτυχώς');
    closeModal();
  }catch(e){
    if(e.code==='auth/requires-recent-login')
      showToast('❌ Απαιτείται νέα σύνδεση πρώτα','err');
    else
      showToast('❌ '+e.message,'err');
  }
}

// ── Topbar: Floating particles + wave animation ─────────────────────────────
(function initTopbarAnim(){
  const canvas = document.getElementById('topbar-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, dpr=1, t=0;
  let particles=[];

  function resize(){
    dpr = window.devicePixelRatio||1;
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width  = W*dpr;
    canvas.height = H*dpr;
    ctx.scale(dpr,dpr);
    initScene();
  }

  function initScene(){
    // Floating orbs
    particles = Array.from({length:18}, (_,i)=>({
      x: Math.random()*W,
      y: Math.random()*H,
      r: 1.5 + Math.random()*3,
      dx: (Math.random()-.5)*0.35,
      dy: (Math.random()-.5)*0.2,
      hue: Math.random()>0.5 ? 220 : 260,
      phase: Math.random()*Math.PI*2,
      opacity: 0.25 + Math.random()*0.45
    }));


  }

  function drawWave(alpha){
    ctx.beginPath();
    for(let x=0; x<=W; x+=2){
      const y1 = H*0.5 + Math.sin(x*0.025 + t*0.8)*H*0.14 + Math.sin(x*0.012 - t*0.5)*H*0.08;
      x===0 ? ctx.moveTo(x,y1) : ctx.lineTo(x,y1);
    }
    ctx.strokeStyle=`rgba(90,127,212,${alpha*0.7})`;
    ctx.lineWidth=1.2;
    ctx.stroke();

    // Second wave
    ctx.beginPath();
    for(let x=0; x<=W; x+=2){
      const y2 = H*0.6 + Math.sin(x*0.018 - t*0.6)*H*0.1 + Math.cos(x*0.03 + t*0.4)*H*0.06;
      x===0 ? ctx.moveTo(x,y2) : ctx.lineTo(x,y2);
    }
    ctx.strokeStyle=`rgba(139,111,218,${alpha*0.5})`;
    ctx.lineWidth=0.8;
    ctx.stroke();
  }

  function animate(){
    ctx.clearRect(0,0,W,H);
    t += 0.012;

    // Waves in left portion
    drawWave(0.9);

    // Floating orb particles
    particles.forEach(p=>{
      p.x += p.dx; p.y += p.dy;
      p.phase += 0.018;
      if(p.x<-10) p.x=W+10;
      if(p.x>W+10) p.x=-10;
      if(p.y<-10) p.y=H+10;
      if(p.y>H+10) p.y=-10;

      const pulse = 0.6 + Math.sin(p.phase)*0.4;
      const grad=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      grad.addColorStop(0,`hsla(${p.hue},70%,65%,${p.opacity*pulse})`);
      grad.addColorStop(1,`hsla(${p.hue},70%,65%,0)`);
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);
      ctx.fillStyle=grad;
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  function init(){
    if(!canvas.offsetWidth){ setTimeout(init,200); return; }
    resize();
    animate();
  }
  window.addEventListener('resize',()=>{ ctx.setTransform(1,0,0,1,0,0); resize(); });
  setTimeout(init,150);
})();


// ── Login screen: slow breathing gradient orbs ────────────────────────────────
(function initLoginCanvas(){
  const canvas = document.getElementById('login-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, dpr=1, t=0;

  const orbs = [
    {x:.25, y:.25, r:.45, c:'90,127,212',  phase:0},
    {x:.78, y:.18, r:.38, c:'139,111,218', phase:2.1},
    {x:.55, y:.82, r:.42, c:'90,127,212',  phase:4.2},
    {x:.12, y:.72, r:.32, c:'139,111,218', phase:1.1},
    {x:.88, y:.65, r:.35, c:'80,140,200',  phase:3.3},
  ];

  function resize(){
    dpr = window.devicePixelRatio||1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.scale(dpr, dpr);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // Only fill and draw in the content area (below safe area on mobile)
    ctx.fillStyle = '#090910';
    ctx.fillRect(0,0,W,H);


    // Slow-moving soft orbs
    orbs.forEach(o=>{
      const drift = Math.sin(t * .0003 + o.phase) * .04;
      const px = (o.x + drift) * W;
      const py = (o.y + Math.cos(t * .00025 + o.phase) * .035) * H;
      const radius = o.r * Math.min(W, H) * (.85 + Math.sin(t * .0004 + o.phase) * .1);

      const g = ctx.createRadialGradient(px, py, 0, px, py, radius);
      g.addColorStop(0,   `rgba(${o.c}, 0.13)`);
      g.addColorStop(0.4, `rgba(${o.c}, 0.06)`);
      g.addColorStop(1,   `rgba(${o.c}, 0)`);
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI*2);
      ctx.fillStyle = g;
      ctx.fill();
    });

    // Single very subtle horizontal gradient sweep
    const sweep = (Math.sin(t * .00035) + 1) / 2;
    const sg = ctx.createLinearGradient(0, H*(.3 + sweep*.25), W, H*(.5 + sweep*.2));
    sg.addColorStop(0,   'rgba(90,127,212,0)');
    sg.addColorStop(0.5, 'rgba(90,127,212,0.04)');
    sg.addColorStop(1,   'rgba(139,111,218,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H);

    t++;
    requestAnimationFrame(draw);
  }

  function init(){
    if(!canvas.offsetWidth){ setTimeout(init, 100); return; }
    resize();
    draw();
  }
  window.addEventListener('resize', ()=>{ ctx.setTransform(1,0,0,1,0,0); resize(); });
  setTimeout(init, 50);
})();

// ── Drawer: Touch drag (long press) for mobile ────────────────────────────────
let _touchDragId=null, _touchLongTimer=null, _touchDragEl=null, _touchClone=null;

function initDrawerTouchDrag(){
  if(window.innerWidth > 768) return; // desktop only uses mouse drag
  const nav = document.getElementById('drawer-nav');
  if(!nav) return;

  nav.querySelectorAll('.dnav-item').forEach(item=>{
    item.addEventListener('touchstart', onNavTouchStart, {passive:false});
    item.addEventListener('touchmove',  onNavTouchMove,  {passive:false});
    item.addEventListener('touchend',   onNavTouchEnd,   {passive:false});
    item.addEventListener('touchcancel',onNavTouchCancel,{passive:false});
  });
}

function onNavTouchStart(e){
  const item = e.currentTarget;
  const id = item.id.replace('dnav-','');
  _touchLongTimer = setTimeout(()=>{
    // Long press detected - start drag mode
    _touchDragId = id;
    _touchDragEl = item;

    // Haptic feedback
    if(navigator.vibrate) navigator.vibrate(40);

    // Visual feedback: highlight the item
    item.style.opacity = '0.5';
    item.style.background = 'rgba(167,139,250,0.2)';
    item.style.borderRadius = '10px';

    // Create floating clone
    const rect = item.getBoundingClientRect();
    _touchClone = item.cloneNode(true);
    _touchClone.style.cssText = `
      position:fixed;left:${rect.left}px;top:${rect.top}px;
      width:${rect.width}px;z-index:999;opacity:.85;pointer-events:none;
      background:rgba(30,30,40,0.95);border-radius:10px;
      border:1px solid rgba(167,139,250,0.5);
      box-shadow:0 8px 24px rgba(0,0,0,0.5);
      transition:none;
    `;
    document.body.appendChild(_touchClone);

    // Show hint
    if(typeof showToast==='function') showToast('⠿ Σύρε για αναδιάταξη','ok',1500);
  }, 500);
}

function onNavTouchMove(e){
  clearTimeout(_touchLongTimer);
  if(!_touchDragId) return;
  e.preventDefault();
  const touch = e.touches[0];

  // Move clone
  if(_touchClone){
    const rect = _touchDragEl.getBoundingClientRect();
    _touchClone.style.top = (touch.clientY - rect.height/2) + 'px';
  }

  // Highlight target item
  document.querySelectorAll('.dnav-item').forEach(el=>el.style.borderLeft='');
  const els = document.querySelectorAll('.dnav-item');
  let target = null;
  els.forEach(el=>{
    if(el.id === 'dnav-'+_touchDragId) return;
    const r = el.getBoundingClientRect();
    if(touch.clientY >= r.top && touch.clientY <= r.bottom){
      el.style.borderLeft = '3px solid #a78bfa';
      target = el;
    }
  });
}

function onNavTouchEnd(e){
  clearTimeout(_touchLongTimer);
  if(!_touchDragId){_touchLongTimer=null;return;}

  const touch = e.changedTouches[0];
  let toId = null;

  // Find target
  document.querySelectorAll('.dnav-item').forEach(el=>{
    el.style.borderLeft = '';
    if(el.id === 'dnav-'+_touchDragId) return;
    const r = el.getBoundingClientRect();
    if(touch.clientY >= r.top && touch.clientY <= r.bottom) toId = el.id.replace('dnav-','');
  });

  // Cleanup
  if(_touchDragEl){ _touchDragEl.style.opacity=''; _touchDragEl.style.background=''; }
  if(_touchClone){ _touchClone.remove(); _touchClone=null; }

  // Reorder if valid target
  if(toId && toId !== _touchDragId){
    const order = getDrawerOrder();
    const fi=order.indexOf(_touchDragId), ti=order.indexOf(toId);
    if(fi>-1 && ti>-1){
      order.splice(fi,1); order.splice(ti,0,_touchDragId);
      saveDrawerOrder();
      _drawerOrder = order;
      renderDrawerNav();
      initDrawerTouchDrag(); // re-bind
    }
  }

  _touchDragId=null; _touchDragEl=null; _touchLongTimer=null;
}

function onNavTouchCancel(e){
  clearTimeout(_touchLongTimer);
  if(_touchDragEl){ _touchDragEl.style.opacity=''; _touchDragEl.style.background=''; }
  if(_touchClone){ _touchClone.remove(); _touchClone=null; }
  _touchDragId=null; _touchDragEl=null;
}
